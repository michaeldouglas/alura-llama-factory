# Configuração didática do primeiro experimento de SFT com LoRA.
# O treinamento só deve ser executado depois que o dataset tiver DATA_READY_FOR_SFT
# e o ambiente/modelo tiverem sido validados.

model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
model_revision: 7ae557604adf67be50417f59c2c2f167def9a775

dataset_dir: ../dataset/dados/preparados
dataset: escutia_treino
eval_dataset: escutia_validacao

stage: sft
finetuning_type: lora
template: qwen
do_train: true
do_eval: true
seed: 42

cutoff_len: 256
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

bf16: true
fp16: false
pure_bf16: false
gradient_checkpointing: true
dataloader_num_workers: 0

eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
save_only_model: false
overwrite_output_dir: false
logging_strategy: steps
logging_steps: 10
report_to: mlflow
run_name: lora_escutia

output_dir: outputs/resultados/lora_escutia
logging_dir: outputs/logs/lora_escutia
