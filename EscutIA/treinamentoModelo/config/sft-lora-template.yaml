# Template usado por scripts/treinar.py.
# Os caminhos são preenchidos automaticamente para esta pasta.
model_name_or_path: "models/Qwen--Qwen2.5-0.5B-Instruct"
dataset_dir: "data/derived"
dataset: "train"
eval_dataset: "validation"

template: qwen
stage: sft
finetuning_type: lora
do_train: true
do_eval: true
seed: 42

cutoff_len: 256
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
quantization_bit: null
bf16: true
fp16: false
pure_bf16: false
gradient_checkpointing: true
dataloader_num_workers: 0

eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
save_only_model: false
overwrite_output_dir: false
logging_strategy: steps
logging_steps: 10
report_to: none

output_dir: "outputs/sft-lora"
logging_dir: "outputs/sft-lora/logs"
