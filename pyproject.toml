[project]
name = "alura-llama-factory"
version = "0.1.0"
description = "Projeto do curso Alura LLaMA Factory"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch==2.6.0+xpu",
    "torchvision==0.21.0+xpu",
    "torchaudio==2.6.0+xpu",
    "transformers>=4.49,<5",
    "datasets>=2.20,<4",
    "peft>=0.14,<1",
    "accelerate>=0.34,<2",
    "trl>=0.8.6,<1",
    "llamafactory==0.9.5",
    "mlflow>=2.15,<4",
    "huggingface-hub>=0.24,<1",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "protobuf>=4,<6",
    "truststore>=0.10,<1",
    "ipykernel>=6.29,<8",
    "jupyter>=1.1,<2",
    "jupyterlab>=4,<5",
    "ipywidgets>=8.1,<9",
    "jsonschema>=4.23,<5",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "questionary>=2.1,<3",
    "rich>=13.7,<15",
    "hf-xet>=1,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
torchaudio = { index = "pytorch-xpu" }

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
